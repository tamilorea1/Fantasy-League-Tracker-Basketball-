services:
  fantasy-app:
    build:
      context: .
      args:
        # Pass your Supabase URL during the build phase for Prisma
        - DATABASE_URL=${DATABASE_URL}
    ports:
      - "3000:3000"
    env_file:
      - .env
    # This section is the "Magic" from BudgetPal you should definitely keep
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next